<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 0 }; }
  renderVals() {
    const o = (i) => { const on = this.state.pick === i;
      return { pressed: on ? 'true' : 'false', border: on ? '#5446D6' : '#E7E6E0', bg: on ? '#F5F4FF' : '#FFFFFF', dot: on ? '#5446D6' : 'transparent', pick: () => this.setState({ pick: i }) }; };
    return { o0: o(0), o1: o(1), o2: o(2) };
  }
}
