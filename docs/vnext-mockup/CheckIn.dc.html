<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Daily Ten — 早安打卡</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5446D6}a:hover{color:#3B2FB0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 940px; box-sizing: border-box; background: #FAFAF7; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1B1D1A; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 18px; flex-grow: 1">
<header style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none; color: #5F635C">‹ 今日</a><span style="padding: 1px 6px; border-radius: 6px; background: #EFEDE6; font-size: 11px; color: #5F635C">示意資料</span>
</header>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 26px; font-weight: 900">早安打卡</span><span style="font-size: 13px; color: #5F635C">點一下就記錄，10 秒內可復原</span></div>

<section style="background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(27,29,26,0.04), 0 6px 20px rgba(27,29,26,0.06); padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 16px; font-weight: 900; color: #5446D6">眠 Sleep</span><span style="font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 16px; font-weight: 700">{{sleepXp}}<span style="font-size: 12px; color: #5F635C"> / 60 XP</span></span></div>
<sc-if value="{{wakeTodo}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{wake}}" style="min-height: 112px; border-radius: 18px; border: none; background: #5446D6; color: #FFFFFF; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; box-shadow: 0 6px 16px rgba(84,70,214,0.28)">
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>我起床了</span>
<span style="font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 34px; font-weight: 800; line-height: 1.1">06:58</span>
<span style="font-size: 12px; color: #DEDAFF">同時記錄昨晚熄燈 23:00（就寢目標）</span>
</button>
<button type="button" style="min-height: 44px; border: none; background: none; color: #5446D6; font-size: 13px; font-weight: 700; text-align: left; padding: 0">昨晚不是 23:00 熄燈？修改時間</button>
</sc-if>
<sc-if value="{{wakeDone}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; border-radius: 16px; background: #F5F4FF; padding: 6px 14px">
<div style="display: flex; align-items: center; gap: 10px; min-height: 40px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5446D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span style="flex-grow: 1; font-size: 14px">起床 · 在時段內</span><span style="font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 15px; font-weight: 700">06:58</span><span style="width: 44px; text-align: right; font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 14px; font-weight: 700; color: #5446D6">+30</span></div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 40px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5446D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span style="flex-grow: 1; font-size: 14px">熄燈 · 在時段內</span><span style="font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 15px; font-weight: 700">23:00</span><span style="width: 44px; text-align: right; font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 14px; font-weight: 700; color: #5446D6">+20</span></div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 40px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5446D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span style="flex-grow: 1; font-size: 14px">睡眠時數 ≥7 小時</span><span style="font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 15px; font-weight: 700">7h58m</span><span style="width: 44px; text-align: right; font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 14px; font-weight: 700; color: #5446D6">+10</span></div>
</div>
<span style="font-size: 12px; color: #5F635C">晚於時段 30 分鐘內仍有一半分數，不會歸零。</span>
</sc-if>
</section>

<section style="background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(27,29,26,0.04), 0 6px 20px rgba(27,29,26,0.06); padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 16px; font-weight: 900; color: #00795B">探 Explore</span>
<sc-if value="{{exOpen}}" hint-placeholder-val="{{false}}"><span style="font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 16px; font-weight: 700">{{exXp}}<span style="font-size: 12px; color: #5F635C"> / 60 XP</span></span></sc-if>
</div>
<sc-if value="{{exLocked}}" hint-placeholder-val="{{true}}">
<div style="border-radius: 16px; border: 1.5px dashed #C9CBC3; padding: 16px; display: flex; gap: 12px; align-items: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F635C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1"><span style="font-size: 14px; font-weight: 700">起床達標 10 天後解鎖</span>
<div style="height: 8px; border-radius: 4px; background: #EFEDE6"><div style="width: 70%; height: 8px; border-radius: 4px; background: #6C5CE7"></div></div>
<span style="font-size: 12px; color: #5F635C">7 / 10 天 · 先把睡眠顧好</span></div>
</div>
</sc-if>
<sc-if value="{{exOpen}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 12px; align-items: center">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #E3F7F1; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00795B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3a9 9 0 0 1 9 9"/></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">DJ</span><span style="font-size: 12px; color: #5F635C">兩分鐘版本：練 1 個 transition</span></div>
</div>
<span style="font-size: 14px; font-weight: 700">做完了？給這次的興趣分</span>
<div style="display: flex; gap: 6px"><button type="button" onClick="{{r1.pick}}" aria-pressed="{{r1.pressed}}" aria-label="興趣分 1" style="flex-grow: 1; flex-basis: 0; height: 52px; border-radius: 14px; border: 1.5px solid {{r1.border}}; background: {{r1.bg}}; color: {{r1.color}}; font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 20px; font-weight: 800">1</button><button type="button" onClick="{{r2.pick}}" aria-pressed="{{r2.pressed}}" aria-label="興趣分 2" style="flex-grow: 1; flex-basis: 0; height: 52px; border-radius: 14px; border: 1.5px solid {{r2.border}}; background: {{r2.bg}}; color: {{r2.color}}; font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 20px; font-weight: 800">2</button><button type="button" onClick="{{r3.pick}}" aria-pressed="{{r3.pressed}}" aria-label="興趣分 3" style="flex-grow: 1; flex-basis: 0; height: 52px; border-radius: 14px; border: 1.5px solid {{r3.border}}; background: {{r3.bg}}; color: {{r3.color}}; font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 20px; font-weight: 800">3</button><button type="button" onClick="{{r4.pick}}" aria-pressed="{{r4.pressed}}" aria-label="興趣分 4" style="flex-grow: 1; flex-basis: 0; height: 52px; border-radius: 14px; border: 1.5px solid {{r4.border}}; background: {{r4.bg}}; color: {{r4.color}}; font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 20px; font-weight: 800">4</button><button type="button" onClick="{{r5.pick}}" aria-pressed="{{r5.pressed}}" aria-label="興趣分 5" style="flex-grow: 1; flex-basis: 0; height: 52px; border-radius: 14px; border: 1.5px solid {{r5.border}}; background: {{r5.bg}}; color: {{r5.color}}; font-family: 'Bricolage Grotesque', 'Noto Sans TC', system-ui, sans-serif; font-size: 20px; font-weight: 800">5</button></div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #5F635C"><span>沒感覺</span><span>還想再做</span></div>
</sc-if>
</section>
</div>
<sc-if value="{{showToast}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 20px; right: 20px; bottom: 24px; min-height: 52px; border-radius: 16px; background: #1B1D1A; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; box-shadow: 0 10px 24px rgba(27,29,26,0.25)">
<span style="font-size: 14px">{{toast}}</span>
<button type="button" onClick="{{undo}}" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: none; background: none; color: #FFD3C7; font-size: 14px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFD3C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg>復原</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phase": {"editor": "enum", "options": ["P1 睡飽", "P2 探索"], "default": "P1 睡飽", "section": "階段"}, "$preview": {"width": 390, "height": 940}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { wake: false, rate: null, history: [], toast: null }; }
  push(next, label) {
    const snap = { wake: this.state.wake, rate: this.state.rate };
    this.setState(Object.assign({}, next, { history: this.state.history.concat([snap]), toast: label }));
  }
  renderVals() {
    const s = this.state;
    const p2 = (this.props.phase ?? 'P1 睡飽') === 'P2 探索';
    const r = (i) => {
      const on = s.rate === i;
      return { pressed: on ? 'true' : 'false', border: on ? '#00795B' : '#E7E6E0', bg: on ? '#00795B' : '#FFFFFF', color: on ? '#FFFFFF' : '#1B1D1A',
        pick: () => this.push({ rate: i }, '已記錄探索 · 興趣分 ' + i + ' · +40') };
    };
    return {
      wakeTodo: !s.wake, wakeDone: s.wake,
      wake: () => this.push({ wake: true }, '已記錄起床 06:58 · +60'),
      sleepXp: s.wake ? 60 : 0,
      exLocked: !p2, exOpen: p2, exXp: s.rate === null ? 0 : 40,
      r1: r(1), r2: r(2), r3: r(3), r4: r(4), r5: r(5),
      showToast: !!s.toast, toast: s.toast,
      undo: () => {
        const h = s.history;
        if (!h.length) { this.setState({ toast: null }); return; }
        const last = h[h.length - 1];
        this.setState({ wake: last.wake, rate: last.rate, history: h.slice(0, -1), toast: '已復原' });
      }
    };
  }
}
</script>
</body>
</html>
