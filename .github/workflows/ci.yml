name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Repo checks（失效網址、SW 版號與預快取、前端掃描）
        run: node .github/scripts/check-repo.mjs

      - name: 用語表檢查（台灣繁中，新增字串 0 違規）
        run: node tools/jev/check-glossary.js --ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # M1：拆 module 前的 main（ec87e03）作為「行為零變更」的比對基準。M2a 起畫面會刻意改變，屆時移除或改基準。
      - name: Prepare parity baseline
        run: git worktree add "$RUNNER_TEMP/parity-base" ec87e03

      - name: Playwright（單元＋e2e）
        run: npm test
        env:
          PARITY_BASE_DIR: ${{ runner.temp }}/parity-base

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
