<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Daily Ten</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F3F4F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Ten">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
</head>
<body>
<div id="app">

  <!-- ===== 今日 ===== -->
  <section class="screen active" id="s-home" aria-labelledby="h-date">
    <header class="topbar">
      <div><p class="eyebrow" id="h-greet">今天</p><h1 id="h-date">—</h1></div>
      <div class="top-actions">
        <button type="button" class="chip flame" id="h-streak-btn" aria-label="連續天數"><span id="h-streak-ic"></span><b id="h-streak" class="num big">0</b><span>天</span></button>
        <button type="button" class="icon-btn" id="h-settings" data-s="s-settings" aria-label="設定"><span id="h-settings-ic"></span></button>
      </div>
    </header>
    <div id="upd-note" class="banner" role="status" aria-live="polite"></div>
    <div id="mv-legacy" class="card" role="region" aria-labelledby="mv-legacy-title" hidden>
      <h3 id="mv-legacy-title" class="card-title">App 搬到新網址了</h3>
      <p class="small">新網址更新更快，照下面 2 步換過去。</p>
      <ol class="small">
        <li><a class="btn btn-sm" id="mv-open" target="_blank" rel="noopener">打開新網址</a> <span id="mv-open-host"></span></li>
        <li>在 Safari 按「分享」→「加入主畫面」，以後都從新圖示打開。最後長按舊圖示，把它刪除。</li>
      </ol>
    </div>
    <div id="err-card" class="banner" role="alert">
      <div id="err-text"></div>
      <button type="button" class="btn btn-sm" id="err-download">下載原始資料</button>
      <button type="button" class="btn btn-sm" id="err-dismiss">知道了</button>
      <div class="small" id="err-note"></div>
    </div>
    <div id="home-body"></div>
  </section>

  <!-- ===== 健身房 ===== -->
  <section class="screen" id="s-gym" aria-labelledby="gym-title">
    <header class="topbar"><div><p class="eyebrow">一週 4 次</p><h1 id="gym-title">健身房</h1></div></header>
    <div id="gym-body"></div>
  </section>

  <!-- ===== 伸展 ===== -->
  <section class="screen" id="s-stretch" aria-labelledby="stretch-title">
    <header class="topbar"><div><p class="eyebrow">每天早上</p><h1 id="stretch-title">晨間伸展</h1></div></header>
    <div id="stretch-body"></div>
  </section>

  <!-- ===== 探索 ===== -->
  <section class="screen" id="s-explore" aria-labelledby="explore-title">
    <header class="topbar"><div><p class="eyebrow">一週一件新事物</p><h1 id="explore-title">探索</h1></div></header>
    <div id="explore-body"></div>
  </section>

  <!-- ===== 進度 ===== -->
  <section class="screen" id="s-progress" aria-labelledby="progress-title">
    <header class="topbar"><div><p class="eyebrow">紀錄與成就</p><h1 id="progress-title">進度</h1></div></header>
    <div id="progress-body"></div>
  </section>

  <!-- ===== 設定 ===== -->
  <section class="screen" id="s-settings" aria-labelledby="settings-title">
    <header class="topbar">
      <div><h1 id="settings-title">設定</h1></div>
      <button type="button" class="icon-btn" id="settings-back" data-s="s-home" aria-label="返回今日"><span id="settings-back-ic"></span></button>
    </header>
    <div id="settings-body"></div>

    <div class="card" id="backup-card">
      <div class="card-head"><h3 class="card-title">資料備份</h3></div>
      <p class="small">所有紀錄只在這台裝置上。換手機或清除 Safari 網站資料前，先下載備份檔。</p>
      <p class="small" id="bk-status"></p>
      <button type="button" class="btn btn-secondary" id="bk-download">下載備份檔</button>
      <h4 class="section-title">匯入備份</h4>
      <div class="btn-row" style="margin-top:0">
        <button type="button" class="btn" id="imp-file-btn">選擇檔案</button>
        <input type="file" id="imp-file" accept=".json,application/json" hidden>
        <button type="button" class="btn" id="imp-btn">貼上後匯入</button>
      </div>
      <div class="field" style="margin-top:12px"><label for="exp-area">貼上備份檔內容</label><textarea id="exp-area" rows="3" placeholder="{ … }"></textarea></div>
      <div id="imp-error" class="banner"></div>
      <div id="imp-preview" hidden>
        <p class="small">匯入會覆蓋目前的資料。先看差異，再按兩次確認。</p>
        <div id="imp-rows"></div>
        <div id="imp-warnings" class="banner"></div>
        <div class="btn-row"><button type="button" class="btn" id="imp-cancel">取消</button><button type="button" class="btn btn-danger" id="imp-confirm">確認匯入（覆蓋目前資料）</button></div>
      </div>
      <p class="small" id="io-msg"></p>
    </div>
    <p class="version" id="app-version" hidden></p>
    <p class="version">Daily Ten 是個人習慣遊戲。訓練、伸展與健康文字都是一般性參考，不是醫療建議。</p>
  </section>
</div>

<nav id="tabs" aria-label="分頁">
  <button type="button" data-s="s-home" class="on" aria-current="page"><span class="ic" data-ic="home"></span>今日</button>
  <button type="button" data-s="s-gym"><span class="ic" data-ic="gym"></span>健身房</button>
  <button type="button" data-s="s-stretch"><span class="ic" data-ic="stretch"></span>伸展</button>
  <button type="button" data-s="s-explore"><span class="ic" data-ic="explore"></span>探索</button>
  <button type="button" data-s="s-progress"><span class="ic" data-ic="progress"></span>進度</button>
</nav>

<div id="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button type="button" id="toast-action" hidden></button></div>
<div id="sheet" class="sheet" hidden></div>
<div id="session" class="overlay" hidden></div>
<div id="guide" class="overlay" hidden></div>
<div id="cele" class="overlay" hidden></div>
<canvas id="confetti" hidden></canvas>

<script type="module" src="js/app.js"></script>
</body>
</html>
